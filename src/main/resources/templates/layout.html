<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Sunrise</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link th:href="@{/css/style-v2.css}" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper" class="d-flex">
    <!-- Sidebar -->
    <div class="bg-gradient-primary sidebar sidebar-dark"
         th:replace="~{fragments/tab-bar-v2 :: tab-bar-v2}"
         style="min-height: 100vh; width: 300px;">
    </div>

    <!-- Content -->
    <div id="content-wrapper" class="flex-grow-1 d-flex flex-column">
        <div id="content">
            <!-- Header -->
            <div th:replace="~{fragments/header-v2 :: header-v2}"></div>

            <!-- Main Content -->
            <div class="container py-4" style="min-height: 68vh;">
                <section layout:fragment="content">
                    <h1>Welcome to Sunrise</h1>
                    <p>Content goes here...</p>
                </section>
            </div>

            <!-- Footer -->
            <div th:replace="~{fragments/footer-v2 :: footer-v2}"></div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS (with Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom Scripts -->
<script th:src="@{/js/script-v2.js}" type="application/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
