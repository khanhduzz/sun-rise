<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" th:href="@{/img/spreadsheet_17087859.png}">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Budgeting Service</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <!-- FontAwesome + Bootstrap Icons -->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">

    <!-- SB Admin 2 Styles -->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <link th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}" rel="stylesheet" type="text/css">

    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 1rem;
            box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.05);
        }

        .modal-content {
            border-radius: 1rem;
        }

        .table {
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .btn {
            border-radius: 0.5rem;
        }
    </style>
</head>

<body id="page-top">
<div id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{tab_bar :: tab-bar}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <!-- Topbar -->
            <div th:replace="~{header :: header}"></div>

            <!-- Page Content -->
            <div class="container-fluid px-4 py-4">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">Danh mục thu/chi</h1>
                    <div th:if="${countCategory < 10}">
                        <a class="btn btn-sm btn-primary shadow-sm d-flex align-items-center gap-2"
                           href="#" data-toggle="modal" data-target="#createCategoryModal">
                            <i class="fas fa-plus"></i> Tạo danh mục
                        </a>
                    </div>
                </div>

                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">Danh mục Thu / Chi</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" id="dataTableCategory">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Tên danh mục</th>
                                    <th>Ngày tạo</th>
                                    <th>Ngày cập nhật</th>
                                    <th>Trạng thái</th>
                                    <th>Chỉnh sửa</th>
                                </tr>
                                </thead>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div th:replace="~{footer :: footer}"></div>
        </div>
    </div>
</div>

<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>

<!-- Logout Modal -->
<div class="modal fade" id="logoutModal" tabindex="-1" role="dialog"
     aria-labelledby="logoutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content rounded shadow-sm">
            <div class="modal-header">
                <h5 class="modal-title">Bạn có muốn thoát?</h5>
                <button class="close" type="button" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" data-dismiss="modal">Hủy</button>
                <a class="btn btn-primary" th:href="@{/auth/login}">Đăng xuất</a>
            </div>
        </div>
    </div>
</div>

<!-- Create Category Modal -->
<div class="modal fade" id="createCategoryModal" tabindex="-1" role="dialog"
     aria-labelledby="createCategoryModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content rounded shadow">
            <div class="modal-header">
                <h5 class="modal-title">Tạo tên danh mục</h5>
                <button class="close" type="button" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <form id="addCategory" th:object="${categoryCreate}" th:action="@{/category/add}" method="POST">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="inputCategory">Tên danh mục</label>
                        <input type="text" class="form-control" id="inputCategory" th:field="*{name}">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" type="reset" data-dismiss="modal">Hủy</button>
                    <button class="btn btn-primary" type="submit">Gửi</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Category Modal -->
<div class="modal fade" id="editCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content rounded shadow">
            <div class="modal-header">
                <h5 class="modal-title">Sửa tên danh mục</h5>
                <button class="close" type="button" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <form id="updateCategory" th:object="${categoryUpdate}" th:action="@{/category/update/{id}}" method="POST">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="inputNewCategoryName">Tên danh mục</label>
                        <input type="text" class="form-control" id="inputNewCategoryName" th:field="*{name}">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" type="reset" data-dismiss="modal">Hủy</button>
                    <button class="btn btn-primary" type="submit">Gửi</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>
<script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
<script th:src="@{/vendor/datatables/dataTables.bootstrap4.min.js}"></script>

<script type="text/javascript">
    const installTable = (id, url, cols) => {
        return $(`#${id}`).DataTable({
            language: {
                search: "Tìm kiếm:",
                sLengthMenu: "Hiển thị _MENU_ bản ghi",
                sInfo: "Hiển thị từ _START_ đến _END_ trên _TOTAL_ bản ghi",
                emptyTable: "Không có bản ghi nào có sẵn",
                paginate: {
                    previous: "<", first: "<<", next: ">", last: ">>"
                }
            },
            serverSide: true,
            order: [1, "desc"],
            ajax: {
                url: url,
                type: "POST",
                contentType: "application/json",
                data: function (d) {
                    d.order.forEach(function (item, index) {
                        d.order[index].colName = d.columns[item.column].data;
                    });
                    return JSON.stringify(d);
                }
            },
            columns: cols
        });
    };

    const cols = [
        {data: "id"},
        {data: "name"},
        {data: "createdDate"},
        {data: "lastModifiedDate"},
        {
            data: "status", render: function (data) {
                return translateStatus(data);
            }
        },
        {
            data: null, render: function (row) {
                if (row.admin) return "";
                return `
                    <div class="btn-group" role="group">
                        <button class="btn btn-sm ${row.status === 'ACTIVE' ? 'btn-warning' : 'btn-success'}"
                                onclick="changeCategoryStatus(${row.id}, '${row.status === 'ACTIVE' ? 'deactivate' : 'activate'}')">
                            <i class="fas ${row.status === 'ACTIVE' ? 'fa-ban' : 'fa-check-circle'}"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" data-toggle="modal" data-target="#editCategoryModal">
                            <i class="fas fa-pencil-alt"></i>
                        </button>
                    </div>`;
            }
        }
    ];

    const table = installTable('dataTableCategory', '/sun/category/page', cols);

    $('#dataTableCategory tbody').on('click', 'tr', function () {
        const data = table.row(this).data();
        $('#inputCategory').val(data.name);
        $('#inputNewCategoryName').val(data.name);
        $('#updateCategory').attr('action', `/sun/category/update/${data.id}`);
    });

    function changeCategoryStatus(id, action) {
        if (confirm(`Bạn chắc chắn muốn ${action === 'activate' ? 'kích hoạt' : 'vô hiệu hóa'} danh mục này?`)) {
            fetch(`/sun/category/${action}/${id}`, {method: 'GET'})
                .then(response => {
                    if (response.ok) {
                        table.ajax.reload(null, false);
                    } else {
                        alert('Không thể thay đổi trạng thái. Vui lòng thử lại!');
                    }
                })
                .catch(() => alert('Lỗi mạng, vui lòng thử lại sau!'));
        }
    }

    const translateStatus = (status) => {
        if (status === 'ACTIVE')
            return '<span class="text-success"><i class="fas fa-check-circle me-1"></i>Hoạt động</span>';
        if (status === 'NOT_ACTIVE')
            return '<span class="text-warning"><i class="fas fa-ban me-1"></i>Không hoạt động</span>';
        return status;
    };
</script>
</body>
</html>
